                -ComputerName $env:TAILSCALE_IP `[span_94](start_span)[span_94](end_span)
                -Port 3389 `[span_95](start_span)[span_95](end_span)
                -WarningAction SilentlyContinue[span_96](start_span)[span_96](end_span)

              if ($result.TcpTestSucceeded) {[span_97](start_span)[span_97](end_span)
                  $connected = $true[span_98](start_span)[span_98](end_span)
                  break[span_99](start_span)[span_99](end_span)
              }[span_100](start_span)[span_100](end_span)

              Start-Sleep -Seconds 5[span_101](start_span)[span_101](end_span)
          }[span_102](start_span)[span_102](end_span)

          if (-not $connected) {[span_103](start_span)[span_103](end_span)
              throw "RDP port 3389 is not reachable.[span_104](start_span)"[span_104](end_span)
          }[span_105](start_span)[span_105](end_span)

