          $tsIP = $null[span_74](start_span)[span_74](end_span)
          $retries = 0[span_75](start_span)[span_75](end_span)

          while (-not $tsIP -and $retries -lt 10) {[span_76](start_span)[span_76](end_span)
              $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4[span_77](start_span)[span_77](end_span)

              if (-not $tsIP) {[span_78](start_span)[span_78](end_span)
                  Start-Sleep -Seconds 5[span_79](start_span)[span_79](end_span)
              }[span_80](start_span)[span_80](end_span)

              $retries++[span_81](start_span)[span_81](end_span)
          }[span_82](start_span)[span_82](end_span)

          if (-not $tsIP) {[span_83](start_span)[span_83](end_span)
