        shell: powershell[span_23](start_span)[span_23](end_span)
        run: |[span_24](start_span)[span_24](end_span)
          $username = "Skyro[span_25](start_span)"[span_25](end_span)

          $upper = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.ToCharArray()[span_26](start_span)[span_26](end_span)
          $lower = 'abcdefghijklmnopqrstuvwxyz'.ToCharArray()[span_27](start_span)[span_27](end_span)
          $numbers = '0123456789'.ToCharArray()[span_28](start_span)[span_28](end_span)
          $special = '!@#$%^&*()-_=+[]{}:,.?'.ToCharArray()[span_29](start_span)[span_29](end_span)

          $passwordChars = @()[span_30](start_span)[span_30](end_span)
          $passwordChars += $upper | Get-Random -Count 4[span_31](start_span)[span_31](end_span)
          $passwordChars += $lower | Get-Random -Count 4[span_32](start_span)[span_32](end_span)
          $passwordChars += $numbers | Get-Random -Count 4[span_33](start_span)[span_33](end_span)
          $passwordChars += $special | Get-Random -Count 4[span_34](start_span)[span_34](end_span)

          $password = -join ($passwordChars | Sort-Object { Get-Random })[span_35](start_span)[span_35](end_span)
          $securePassword = ConvertTo-SecureString $password -AsPlainText -Force[span_36](start_span)[span_36](end_span)

          if (Get-LocalUser -Name $username -ErrorAction SilentlyContinue) {[span_37](start_span)[span_37](end_span)
              Remove-LocalUser -Name $username[span_38](start_span)[span_38](end_span)
          }[span_39](start_span)[span_39](end_span)

          New-LocalUser `[span_40](start_span)[span_40](end_span)
            -Name $username `[span_41](start_span)[span_41](end_span)[span_42](start_span)[span_42](end_span)
            -Password $securePassword `[span_43](start_span)[span_43](end_span)[span_44](start_span)[span_44](end_span)
            -AccountNeverExpires `[span_45](start_span)[span_45](end_span)[span_46](start_span)[span_46](end_span)
            -PasswordNeverExpires `[span_47](start_span)[span_47](end_span)[span_48](start_span)[span_48](end_span)
            -UserMayNotChangePassword[span_49](start_span)[span_49](end_span)

          Add-LocalGroupMember -Group "Administrators" -Member $username -ErrorAction SilentlyContinue[span_50](start_span)[span_50](end_span)
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $username -ErrorAction SilentlyContinue[span_51](start_span)[span_51](end_span)

          if (-not (Get-LocalUser -Name $username -ErrorAction SilentlyContinue)) {[span_52](start_span)[span_52](end_span)
              throw "Failed to create RDP user.[span_53](start_span)"[span_53](end_span)
          }[span_54](start_span)[span_54](end_span)

          "RDP_CREDS=User: $username | Password: $password" |[span_55](start_span)[span_55](end_span)
            Out-File $env:GITHUB_ENV -Append -Encoding utf8[span_56](start_span)[span_56](end_span)

