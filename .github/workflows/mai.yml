          $installerPath = "$env:TEMP\tailscale.msi[span_61](start_span)"[span_61](end_span)

          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath[span_62](start_span)[span_62](end_span)

          Start-Process msiexec.exe `[span_63](start_span)[span_63](end_span)
            -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" `[span_64](start_span)[span_64](end_span)[span_65](start_span)[span_65](end_span)
            -Wait[span_66](start_span)[span_66](end_span)

