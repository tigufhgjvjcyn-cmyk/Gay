          $System = Get-WmiObject -Class Win32_ComputerSystem
          $System.AutomaticManagedPagefile = $false
          $System.Put()
          Set-CimInstance -Query "Select * from Win32_PageFileSetting" -Property @{InitialSize = 32768; MaximumSize = 32768} -ErrorAction SilentlyContinue

          Write-Host "Enabling High Performance Power Plan..."
          powercfg /setactive 8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c

      - name: Configure RDP[span_9](start_span)[span_9](end_span)
        shell: powershell[span_10](start_span)[span_10](end_span)
        run: |[span_11](start_span)[span_11](end_span)
          $rdpPath = 'HKLM:\System\CurrentControlSet\Control\Terminal Server[span_12](start_span)'[span_12](end_span)
          $tcpPath = 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp[span_13](start_span)'[span_13](end_span)

          Set-ItemProperty -Path $rdpPath -Name 'fDenyTSConnections' -Value 0 -Force[span_14](start_span)[span_14](end_span)
          Set-ItemProperty -Path $tcpPath -Name 'UserAuthentication' -Value 0 -Force[span_15](start_span)[span_15](end_span)
          Set-ItemProperty -Path $tcpPath -Name 'SecurityLayer' -Value 0 -Force[span_16](start_span)[span_16](end_span)

          netsh advfirewall firewall delete rule name="RDP-Tailscale" 2>$null[span_17](start_span)[span_17](end_span)
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389[span_18](start_span)[span_18](end_span)

          if (Get-Service -Name TermService -ErrorAction SilentlyContinue) {[span_19](start_span)[span_19](end_span)
              Restart-Service -Name TermService -Force[span_20](start_span)[span_20](end_span)
          }[span_21](start_span)[span_21](end_span)

