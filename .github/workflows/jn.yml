name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Configure RDP
        shell: powershell
        run: |
          $rdpPath = 'HKLM:\System\CurrentControlSet\Control\Terminal Server'
          $tcpPath = 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp'

          Set-ItemProperty -Path $rdpPath -Name 'fDenyTSConnections' -Value 0 -Force
          Set-ItemProperty -Path $tcpPath -Name 'UserAuthentication' -Value 0 -Force
          Set-ItemProperty -Path $tcpPath -Name 'SecurityLayer' -Value 0 -Force

          netsh advfirewall firewall delete rule name="RDP-ngrok" 2>$null
          netsh advfirewall firewall add rule name="RDP-ngrok" dir=in action=allow protocol=TCP localport=3389

          if (Get-Service -Name TermService -ErrorAction SilentlyContinue) {
              Restart-Service -Name TermService -Force
          }

      - name: Create RDP User
        shell: powershell
        run: |
          $username = "Phuongnam"

          $upper = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.ToCharArray()
          $lower = 'abcdefghijklmnopqrstuvwxyz'.ToCharArray()
          $numbers = '0123456789'.ToCharArray()
          $special = '!@#$%^&*()-_=+[]{}:,.?'.ToCharArray()

          $passwordChars = @()
          $passwordChars += $upper | Get-Random -Count 4
          $passwordChars += $lower | Get-Random -Count 4
          $passwordChars += $numbers | Get-Random -Count 4
          $passwordChars += $special | Get-Random -Count 4

          $password = -join ($passwordChars | Sort-Object { Get-Random })
          $securePassword = ConvertTo-SecureString $password -AsPlainText -Force

          if (Get-LocalUser -Name $username -ErrorAction SilentlyContinue) {
              Remove-LocalUser -Name $username
          }

          New-LocalUser `
            -Name $username `
            -Password $securePassword `
            -AccountNeverExpires `
            -PasswordNeverExpires `
            -UserMayNotChangePassword

          Add-LocalGroupMember -Group "Administrators" -Member $username -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $username -ErrorAction SilentlyContinue

          if (-not (Get-LocalUser -Name $username -ErrorAction SilentlyContinue)) {
              throw "Failed to create RDP user."
          }

          "RDP_CREDS=User: $username | Password: $password" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install ngrok
        shell: powershell
        run: |
          $ngrokZip = "$env:TEMP\ngrok.zip"
          $ngrokDir = "$env:RUNNER_TEMP\ngrok"
          $ngrokPath = Join-Path $ngrokDir "ngrok.exe"

          Invoke-WebRequest `
            -Uri "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip" `
            -OutFile $ngrokZip

          New-Item -ItemType Directory -Path $ngrokDir -Force | Out-Null
          Expand-Archive -Path $ngrokZip -DestinationPath $ngrokDir -Force
          Remove-Item $ngrokZip -Force

          & $ngrokPath config add-authtoken "${{ secrets.NGROK_AUTHTOKEN }}"

          if ($LASTEXITCODE -ne 0) {
              throw "Failed to configure ngrok."
          }

          "NGROK_PATH=$ngrokPath" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Establish ngrok Connection
        shell: powershell
        run: |
          $logPath = "$env:RUNNER_TEMP\ngrok.log"
          $errorLogPath = "$env:RUNNER_TEMP\ngrok-error.log"

          $ngrokProcess = Start-Process `
            -FilePath $env:NGROK_PATH `
            -ArgumentList "tcp 3389 --log=stdout" `
            -RedirectStandardOutput $logPath `
            -RedirectStandardError $errorLogPath `
            -WindowStyle Hidden `
            -PassThru

          $tunnel = $null

          for ($i = 1; $i -le 30; $i++) {
              Start-Sleep -Seconds 2

              try {
                  $response = Invoke-RestMethod `
                    -Uri "http://127.0.0.1:4040/api/tunnels" `
                    -ErrorAction Stop

                  $tunnel = $response.tunnels |
                    Where-Object { $_.proto -eq "tcp" } |
                    Select-Object -First 1
              }
              catch {
                  $tunnel = $null
              }

              if ($tunnel -and $tunnel.public_url) {
                  break
              }

              if ($ngrokProcess.HasExited) {
                  Get-Content $errorLogPath -ErrorAction SilentlyContinue
                  throw "ngrok exited before creating a tunnel."
              }
          }

          if (-not $tunnel -or -not $tunnel.public_url) {
              Get-Content $errorLogPath -ErrorAction SilentlyContinue
              throw "ngrok TCP tunnel was not created."
          }

          $address = $tunnel.public_url -replace '^tcp://', ''

          "NGROK_ADDRESS=$address" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Verify RDP Accessibility
        shell: powershell
        run: |
          $parts = $env:NGROK_ADDRESS -split ':', 2
          $connected = $false

          for ($i = 1; $i -le 6; $i++) {
              $result = Test-NetConnection `
                -ComputerName $parts[0] `
                -Port ([int]$parts[1]) `
                -WarningAction SilentlyContinue

              if ($result.TcpTestSucceeded) {
                  $connected = $true
                  break
              }

              Start-Sleep -Seconds 5
          }

          if (-not $connected) {
              throw "ngrok RDP endpoint is not reachable."
          }

      - name: Maintain Connection
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "======================================"
          Write-Host "RDP ACCESS"
          Write-Host "======================================"
          Write-Host "Address : $env:NGROK_ADDRESS"
          Write-Host "Username: Phuongnam"
          Write-Host "Credentials: $env:RDP_CREDS"
          Write-Host "======================================"
          Write-Host ""

          while ($true) {
              Write-Host "[$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')] RDP Active"
              Start-Sleep -Seconds 300
          }
